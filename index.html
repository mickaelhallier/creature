<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRÆTURE — Identités & récits visuels</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: #2D516A;
            color: #F5F2E9;
            font-family: Arial, Helvetica, sans-serif;
        }

        .hero {
            height: 100vh;
            min-height: 600px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;
            position: relative;
        }

        .logo {
            width: 1173px;
            max-width: 60vw;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-family: Georgia, serif;
            font-size: clamp(52px, 8vw, 90px);
            font-weight: normal;
            letter-spacing: 8px;
        }

        .baseline {
            margin-top: 18px;
            font-size: 16px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .scroll {
            position: absolute;
            bottom: 35px;

            color: #F5F2E9;
            text-decoration: none;

            font-size: 14px;
            letter-spacing: 2px;
        }

        .scroll span {
            display: block;
            font-size: 24px;
            margin-top: 8px;
        }

    </style>
</head>

<body>

    <section class="hero">

        <img src="logo_full_alt.png" alt="Logo CRÆTURE" class="logo">

        <a href="#pourquoi" class="scroll">
            Découvrir
            <span>↓</span>
        </a>

    </section>

</body>
</html>
